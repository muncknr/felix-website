<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Felix</title>

  <style>
    :root {
      --paper: #f4f0e8;
      --paper-deep: #eae4d9;
      --surface: #fffdf8;
      --ink: #2c2a26;
      --muted: #7a756d;
      --line: #d1ccc4;
      --cat-bubble: #ece7de;
      --user-bubble: #3a3834;
      --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.07);
      --shadow-deep: 0 25px 50px -12px rgba(44, 42, 38, 0.15);
      /* Smooth transition curve */
      --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    }

    /* Girl Mode Palette */
    .girl-mode {
      --paper: #fdf2f8;
      --paper-deep: #fce7f3;
      --surface: #ffffff;
      --ink: #9d174d;
      --muted: #be185d;
      --line: #fbcfe8;
      --cat-bubble: #fce7f3;
      --user-bubble: #db2777;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: 
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.9), transparent 40rem),
        var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      line-height: 1.6;
      transition: background 0.5s ease, color 0.5s ease;
    }

    button, input { font: inherit; }

    .chat-container {
      position: relative;
      width: min(760px, 100%);
      height: min(900px, calc(100dvh - 48px));
      min-height: 560px;
      background: rgba(255, 253, 248, .97);
      border: 1px solid rgba(112, 101, 85, .15);
      border-radius: 32px;
      box-shadow: var(--shadow-deep), 0 -2px 10px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-title {
      flex: 0 0 auto;
      padding: 24px;
      text-align: center;
      background: linear-gradient(to bottom, #fffdf9, #fbf8f2);
      border-bottom: 1px solid var(--line);
    }

    .page-title img {
      display: block;
      width: min(500px, 92%);
      max-height: 132px;
      object-fit: contain;
      margin: 0 auto;
      mix-blend-mode: multiply;
    }

    .presence {
      margin-top: 4px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .presence::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: #73836a;
      vertical-align: middle;
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="main-theme">
  <div class="chat-container">
    <header class="page-title">
      <img src="felix-header.png" alt="Felix Header" />
      <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
        <div class="presence">Online</div>
        <div style="font-size: .75rem; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px;">
          Girl Mode
          <input type="checkbox" id="girlModeToggle" style="cursor: pointer;">
        </div>
      </div>
    </header>
    <main class="messages" id="messages">
      <!-- Messages will appear here -->
    </main>
  </div>

  <script>
    const toggle = document.getElementById('girlModeToggle');
    const body = document.body;

    toggle.addEventListener('change', () => {
      if (toggle.checked) {
        body.classList.add('girl-mode');
      } else {
        body.classList.remove('girl-mode');
      }
    });
  </script>
</body>
</html>
